<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>M5 Ranked PvP — World Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="board.css"/>
</head>
<!--
  This page is not the menu. It is painted into a texture and drawn on a flat
  surface out in the world, so it is built for one job: be readable from ten
  metres away, and cost as close to nothing as a browser can while it sits
  there. No animation loops, no timers, no fetches — it draws once when the
  client sends it rows and then does nothing at all until the next set.
-->
<body>
  <div class="board" id="board">

    <!-- left: the three at the top, as a podium -->
    <aside class="podium">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 48 52" aria-hidden="true">
          <path class="mk-fill" d="M24 1.5 45 13.3v25.4L24 50.5 3 38.7V13.3z"/>
          <path class="mk-edge" d="M24 1.5 45 13.3v25.4L24 50.5 3 38.7V13.3z"/>
          <path class="mk-cup" transform="translate(12 13) scale(1)"
                d="M5 1h14v2.6h4V8a5.4 5.4 0 0 1-5.4 5.4h-.9A6.8 6.8 0 0 1 13 17v2.9h4.2V23H6.8v-3.1H11V17a6.8 6.8 0 0 1-3.7-3.6h-.9A5.4 5.4 0 0 1 1 8V3.6h4V1zm0 5.7H3.7V8c0 1 .5 1.8 1.3 2.2V6.7zm14 0v3.5c.8-.4 1.3-1.2 1.3-2.2V6.7H19z"/>
        </svg>
        <div class="brand-name">
          <b id="bd-name">M5</b>
          <span class="brand-chip" id="bd-accent">RANKED</span>
        </div>
      </div>

      <div class="podium-title"><span id="bd-podium-title">LEADERBOARD TOP 3</span></div>

      <div class="stand" id="bd-stand"></div>
    </aside>

    <!-- right: the standings -->
    <main class="table">
      <div class="table-head">
        <span class="th-title" id="bd-season">SEASON STANDINGS</span>
        <span class="th-sub" id="bd-sub">LEADERBOARD OVERVIEW</span>
      </div>

      <div class="grid head">
        <span class="c-top">TOP</span>
        <span class="c-rank">RANK</span>
        <span class="c-player">PLAYER</span>
        <span class="c-lvl">LVL</span>
        <span class="c-num">KILLS</span>
        <span class="c-num">DEATHS</span>
        <span class="c-num">WINS</span>
        <span class="c-num">LOSSES</span>
        <span class="c-num">K/D</span>
        <span class="c-num c-score">SCORE</span>
      </div>

      <div class="rows" id="bd-rows"></div>
      <div class="empty hidden" id="bd-empty">NO RANKED PLAYERS YET</div>
    </main>
  </div>

  <!-- the crest every rank badge is stamped from, drawn once and referenced,
       and the crown the leader wears -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- the crown is struck metal, not a flat shape: light along the top of
           the band, shadow under it, so it still reads as gold from across
           the street where a single fill goes muddy -->
      <linearGradient id="crownGold" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"   stop-color="#FFF6D8"/>
        <stop offset=".34" stop-color="#F7CF5C"/>
        <stop offset=".72" stop-color="#E0A521"/>
        <stop offset="1"   stop-color="#A9720C"/>
      </linearGradient>
    </defs>

    <symbol id="crest" viewBox="0 0 24 24">
      <path d="M12 2 20.5 6.2v7.1c0 4.1-3.4 7.6-8.5 8.7-5.1-1.1-8.5-4.6-8.5-8.7V6.2L12 2z"
            fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M8.6 13.2 12 9.4l3.4 3.8-1.5.2L12 11.6l-1.9 1.8-1.5-.2z" fill="currentColor"/>
    </symbol>

    <!-- Five points, a banded base and a stone in the middle. The old one was
         a single blocky outline that read as a smudge at board distance. -->
    <symbol id="crown" viewBox="0 0 64 46">
      <path class="cr-body"
            d="M7 35 3.2 13.4 18 21.6 32 5.4 46 21.6 60.8 13.4 57 35z"/>
      <rect class="cr-band" x="6" y="35.4" width="52" height="7.6" rx="2.6"/>
      <circle class="cr-tip" cx="3.2" cy="10.4" r="3.2"/>
      <circle class="cr-tip" cx="32"  cy="4.0"  r="3.8"/>
      <circle class="cr-tip" cx="60.8" cy="10.4" r="3.2"/>
      <circle class="cr-gem" cx="32" cy="26.5" r="3.6"/>
      <circle class="cr-gem" cx="18" cy="30.5" r="2.2"/>
      <circle class="cr-gem" cx="46" cy="30.5" r="2.2"/>
    </symbol>
  </svg>

<script src="board.js"></script>
</body>
</html>
